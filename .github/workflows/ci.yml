name: Nova Salud CI/CD Pipeline

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  qa-build-and-test:
    name: QA Audit • Typecheck, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm install

      - name: Install backend dependencies
        run: npm --prefix backend install

      - name: Verify database schema & seed adapter
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:seed

      - name: Run TypeScript strict typecheck (lint)
        run: npm run lint

      - name: Run automated API, FEFO & RBAC integration tests
        run: npm test

      - name: Build production frontend bundle
        run: npm run build

