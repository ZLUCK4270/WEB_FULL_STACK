services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: novasalud-sqlserver
    restart: unless-stopped
    environment:
      SA_PASSWORD: "NovaSalud2026!"
      MSSQL_SA_PASSWORD: "NovaSalud2026!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - novasalud_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'NovaSalud2026!' -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'NovaSalud2026!' -Q 'SELECT 1' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novasalud-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_USER: sa
      DB_PASSWORD: "NovaSalud2026!"
      DB_DATABASE: NovaSalud
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_ENCRYPT: "false"
      JWT_SECRET: nova_salud_secreto_curso_2026
      JWT_EXPIRES_IN: 24h
      PORT: 8081
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - novasalud_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: novasalud-frontend
    restart: unless-stopped
    ports:
      - "3080:80"
    depends_on:
      - backend
    networks:
      - novasalud_net

networks:
  novasalud_net:
    driver: bridge

volumes:
  sqlserver_data:
